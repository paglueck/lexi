name: Release

# Builds the desktop installers and, for a version tag, publishes them as a
# GitHub release. The website links to releases/latest/download/<file>, and
# the desktop app reads its update feed (latest*.yml) from the same place.
#
#   git tag v1.2.3 && git push origin v1.2.3   → build + release
#   Actions → Release → Run workflow           → build only, installers as
#                                                 workflow artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Every job starts read-only; only the release job gets write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      # Pinned to full commit SHAs; Dependabot (github-actions) keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match package.json version $version (expected v$version)."
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            script: desktop:mac
            name: macos-arm64
          - os: windows-latest
            script: desktop:win
            name: windows-x64
          - os: ubuntu-latest
            script: desktop:linux
            name: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # The Mac build is ad-hoc signed (identity '-' in electron-builder.yml);
      # don't let electron-builder go looking for certificates on the runner.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Writes the installers and latest*.yml to apps/desktop/release/;
      # --publish never in the dist scripts, the release job uploads.
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lexi-${{ needs.version.outputs.version }}-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
            !apps/desktop/release/builder-debug.yml

  release:
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          ls -l dist
          flags=()
          # A prerelease never becomes "latest", so neither the website links
          # nor the update feed pick it up.
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lexi $VERSION" \
            --notes-file apps/desktop/build/release-notes.md \
            --verify-tag \
            "${flags[@]}"
